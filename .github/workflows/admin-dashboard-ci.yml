name: Admin Dashboard CI

on:
  pull_request:
    paths:
      - "admin-dashboard/**"
      - ".github/workflows/admin-dashboard-ci.yml"
  push:
    branches: [main]
    paths:
      - "admin-dashboard/**"
      - ".github/workflows/admin-dashboard-ci.yml"

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-dashboard/package.json
      - run: npm install
      - name: Report dashboard dependency vulnerabilities
        if: always()
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log("Dashboard dependency audit:", JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const fixes = item.fixAvailable;
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: fixes,
            }));
          }
          NODE
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
