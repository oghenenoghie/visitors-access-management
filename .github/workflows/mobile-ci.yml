name: Mobile CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  flutter-apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [resident-app, security-app]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.estateaccess .
      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("android/app/build.gradle.kts")
          source = gradle_file.read_text()

          source, count = re.subn(
              r"compileOptions\s*\{",
              "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not locate the Android compileOptions block")

          if "coreLibraryDesugaring(" not in source:
              match = re.search(r"\ndependencies\s*\{", source)
              if match:
                  insert_at = match.end()
                  source = (
                      source[:insert_at]
                      + '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                      + source[insert_at:]
                  )
              else:
                  source += (
                      '\ndependencies {\n'
                      '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                      '}\n'
                  )

          gradle_file.write_text(source)
          PY
      - run: flutter pub get
      - name: Migrate Material UI imports
        run: dart fix --apply --code=migrate_design_widgets
      - name: Apply Dart lint fixes
        run: dart fix --apply
      - name: Show formatter output for inbox screen
        if: always()
        run: dart format --output=show lib/notification_inbox_screen.dart
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
