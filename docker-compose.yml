# Local development stack: PostgreSQL, Redis and the Django API.
# Usage: docker compose up --build   (development defaults only; never reuse these values)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: estate
      POSTGRES_PASSWORD: estate
      POSTGRES_DB: estate_access
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estate -d estate_access"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: dev-only-insecure-key
      FIELD_ENCRYPTION_KEY: "hSceqdnuGkUCIbWgrQHyXRNpkkKIFvFX1T11g7mBvXI="
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      API_DOCS_ENABLED: "true"
      DATABASE_URL: postgres://estate:estate@db:5432/estate_access
      REDIS_URL: redis://redis:6379/0
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
